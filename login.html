<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Librarian Login — GGCMKN Library</title>
<link rel="icon" type="image/jpeg" href="assets/logo.jpg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <div class="logo-wrap">
      <img src="assets/logo.jpg" alt="Logo">
      <h1>Library Admin</h1>
      <p>Govt. Graduate College Mamukanjan</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input class="form-control" type="email" id="email" required
               autocomplete="username" placeholder="librarian@ggcmkn.com">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input class="form-control" type="password" id="password" required
               autocomplete="current-password" placeholder="••••••">
      </div>
      <button class="btn accent lg block" type="submit" id="btn-login">
        Login
      </button>
    </form>

    <div class="footer-link">
      <p><a href="catalog.html">Browse public catalog</a> (no login needed)</p>
    </div>
  </div>
</div>

<script src="js/supabase-client.js"></script>
<script>
(async () => {
  await new Promise(r => {
    document.addEventListener("supabase:ready", r, { once: true });
    document.addEventListener("supabase:failed", r, { once: true });
  });
  if (!window.sb) {
    document.getElementById("btn-login").disabled = true;
    document.getElementById("btn-login").textContent = "Connection failed";
    return;
  }

  // Already logged in? → redirect
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    redirectAfterLogin();
    return;
  }

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("btn-login");
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in…';
    try {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
      UI.toast("Welcome back!", "success");
      setTimeout(redirectAfterLogin, 400);
    } catch (err) {
      UI.toast(err.message || "Login failed", "error");
      btn.disabled = false;
      btn.textContent = "Login";
    }
  });

  function redirectAfterLogin() {
    const params = new URLSearchParams(window.location.search);
    const next = params.get("next") || "index.html";
    window.location.replace(next);
  }
})();
</script>
</body>
</html>
