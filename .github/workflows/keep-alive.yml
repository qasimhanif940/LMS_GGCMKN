name: Keep Supabase Alive

# Daily ping to prevent the Supabase free-tier project from being paused
# after 7 days of inactivity. Runs at 09:00 Asia/Karachi = 04:00 UTC.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Supabase secrets not configured. Skipping ping."
            exit 0
          fi
          echo "Pinging $SUPABASE_URL/rest/v1/books?select=book_id&limit=1 ..."
          curl -sS -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/books?select=book_id&limit=1"
